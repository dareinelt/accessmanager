name: unifi-access-manager

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uam_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - uam
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: nginx:1.27-alpine
    container_name: uam_web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
      - "8443:443"
    entrypoint: ["/bin/sh", "/etc/nginx/web-entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/web-entrypoint.sh:/etc/nginx/web-entrypoint.sh:ro
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    networks:
      - uam
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mariadb:11.4
    container_name: uam_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-unifi_access}
      MARIADB_USER: ${DB_USERNAME:-unifi}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-change-me}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - uam
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uam_cron
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php /var/www/html/bin/cli.php sync; php /var/www/html/bin/cli.php tls:sync; php /var/www/html/bin/cli.php backup:run; sleep 300; done"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - uam

  uam-sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uam_sync
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php /var/www/html/bin/cli.php ad:sync; sleep 300; done"]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - uam

volumes:
  db_data:
  app_storage:

networks:
  uam:
    driver: bridge
