# HTTP: nur Health-Check; alles andere leitet auf HTTPS weiter.
# Hinweis: Der Port in der Weiterleitung (8443) entspricht dem Host-Mapping
# in docker-compose.yml ("8443:443"). Bei abweichendem Mapping hier anpassen.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/html/public;

    location /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# HTTPS: ausgeliefert wird storage/tls/live.crt|key, geschrieben von der
# Anwendung (aktives Zertifikat oder selbstsigniertes Notfall-Zertifikat).
server {
    listen 443 ssl;
    server_name _;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /var/www/html/storage/tls/live.crt;
    ssl_certificate_key /var/www/html/storage/tls/live.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    server_tokens off;

    # Security headers
    # CSP: Skripte/Styles nur vom eigenen Origin. 'unsafe-inline' ist noch
    # noetig, da die Views Inline-<script>-Bloecke und style-Attribute nutzen.
    # Clickjacking-Schutz ueber frame-ancestors 'none' (+ X-Frame-Options).
    # HSTS bewusst NICHT gesetzt: solange das selbstsignierte Notfall-Zertifikat
    # aktiv sein kann, wuerde HSTS den Zugriff im Browser sperren. Nach dem
    # Import eines CA-signierten Zertifikats kann folgende Zeile aktiviert werden:
    # add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS on;
        # httpoxy mitigation
        fastcgi_param HTTP_PROXY "";
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(log|sql|env)$ {
        deny all;
    }
}
